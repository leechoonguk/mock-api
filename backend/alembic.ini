# Alembic configuration.

[alembic]
# Path to migration scripts, relative to this ini file.
script_location = %(here)s/alembic

# Sequential numeric migration files: 1_create_mock_tables.py, 2_..., ...
file_template = %%(rev)s_%%(slug)s

# Add the project root to sys.path so env.py can import the app package.
prepend_sys_path = .

# database URL is provided at runtime by env.py (from DATABASE_URL env / .env).
sqlalchemy.url =

[post_write_hooks]
# Auto-format generated migration files with ruff (format only — no import removal).
hooks = ruff
ruff.type = exec
ruff.executable = .venv/bin/ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
