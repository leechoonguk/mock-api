[project]
name = "backend"
version = "0.1.0"
description = "Mock API server backend"
# The floor, not the choice: `.python-version` pins 3.14, which is what the
# venv is built with. A gate that depends on which interpreter the machine
# happened to have is not a gate.
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.12",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.22",
    "greenlet>=3.1",
    "alembic>=1.16",
    "structlog>=25",
    # The transport starlette's TestClient drives requests through, and the
    # client the proxy tests send through the proxy with.
    "httpx2>=2.12",
    # The forward proxy: CONNECT, per-host certificates from a local CA, and the
    # flows the record and mock modes read and answer.
    "mitmproxy>=12.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6",
    "pytest-xdist>=3.6",
    "pytest-env>=1.1",
    "ruff>=0.12",
    # Pinned: a type checker that moves is a gate that disagrees with itself.
    "pyright==1.1.414",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# "D" (pydocstyle) owns the docstring standard, scoped to tests by the negated
# per-file-ignore below: app modules carry section banners instead.
# Complexity is measured, not reviewed: C901, PLR0912 and PLR0915 at ruff's
# defaults. PLR0913 is absent - a router's signature is its contract with
# FastAPI's DI and OpenAPI, so the linter would fight every endpoint.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "D", "C901", "PLR0912", "PLR0915", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# Two blank lines after the import block - the same separation every other
# banner section gets, so the page has one rhythm instead of two.
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerated migrations don't respect line-length, and a revision is
# an immutable artifact the linter must not demand edits of.
"alembic/versions/*.py" = ["E501", "W292", "I001"]
# Docstrings are required in tests only: every test states why its case is a
# contract. Elsewhere the section-banner standard (code-layout.md) applies.
"!tests/**.py" = ["D"]
# An empty package marker has nothing to document.
"tests/**/__init__.py" = ["D104"]
# A test asserts (S101), and `subprocess` runs our own migration binary (S603).
"tests/**.py" = ["S101", "S603"]

[tool.pyright]
include = ["app", "alembic", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=100"
# What `Settings()` needs at import time - `app.main` constructs it when the
# conftest imports the app, before any fixture runs. Declared here so the suite
# is a function of the checkout alone: the `.env` Settings reads is gitignored.
# Every value is forced, so a value the shell happens to export cannot change
# what the suite constructs.
env = [
    "ENV=test",
    "APP_NAME=Mock API",
    "DATABASE_URL=sqlite+aiosqlite://",
    "ALLOWED_HOSTS=[\"localhost\", \"127.0.0.1\", \"testserver\"]",
    "CSRF_TRUSTED_ORIGINS=[\"http://localhost:47823\"]",
    "ITEMS_PER_USER=20",
    # The app's own proxy stays down: the proxy tests start theirs on a free port.
    "PROXY_ENABLED=false",
]

[tool.coverage.run]
# app/ only - exclude the entrypoint and the engine wiring, which carry no
# testable logic of their own.
omit = [
    "app/main.py",
    "app/core/database.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
