id: logging-secret-in-log
language: python
# A logged credential outlives the process: it is in the log store, the shipper
# and every downstream index, and rotating it is the only remedy. The call node
# is matched as a whole so a secret passed as any argument — positional, keyword
# or f-string — is caught, which no pattern over a single argument would do.
rule:
  kind: call
  all:
    - regex: "(logger|log|_log|structlog\\.get_logger\\(\\))\\s*\\.\\s*(debug|info|warning|error|exception|critical)"
    - regex: "\\b(api_key|secret_value|hashed_password|password|access_token|secret\\.value)\\b"
message: "never log a credential — log the secret's name or the key id, never its value (backend-api-keys.md, backend-integration.md)"
