id: service-method-async
valid:
  - |
    async def list_batches(self, offset: int = 0, limit: int = 100) -> list[Batch]:
        return []
  # A pure module-level helper is not I/O: forcing `async` on it buys nothing,
  # and forcing it out of the layer is what pushed helpers into `schemas/`.
  - |
    def _normalize(value: str) -> str:
        return value.strip()
  - |
    class BatchService:
        def __init__(self, session: AsyncSession) -> None:
            self.session = session
  - |
    async def purge(session: AsyncSession) -> int:
        return 0
invalid:
  - |
    class BatchService:
        def list_batches(self, offset: int = 0, limit: int = 100) -> list[Batch]:
            return []
  # A module-level function is no safer than a method when it holds the session.
  - |
    def purge(session: AsyncSession) -> int:
        return session.execute(select(Batch))
