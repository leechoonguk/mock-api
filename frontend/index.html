<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mock API</title>
    <!--
      The shell's shape before any script has run - the nav column, the header
      bar, the page's surface - in the mode the reader chose (`app-settings`).
      React's first render replaces it. Measured before: a reload was a white
      page for 50ms, then a spinner. Nothing in it is data.
    -->
    <style>
      #boot { display: flex; height: 100vh; background: var(--boot-page); }
      #boot .nav { display: none; width: var(--boot-nav); flex-shrink: 0; background: var(--boot-bar); border-right: 1px dashed var(--boot-line); }
      #boot .column { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }
      #boot .bar { height: 64px; flex-shrink: 0; background: var(--boot-bar); }
      #boot .surface { flex-grow: 1; margin: 8px 16px 16px; border-radius: 8px; background: var(--boot-fill); }
      @media (min-width: 1200px) {
        #boot .nav { display: block; }
        #boot .bar { height: 72px; }
        #boot .surface { margin: 8px 40px 40px; }
      }
      html { --boot-page: #f4f6f8; --boot-bar: #ffffff; --boot-fill: rgba(145, 158, 171, 0.12); --boot-line: rgba(145, 158, 171, 0.2); --boot-nav: 280px; }
      html[data-boot-mode='dark'] { --boot-page: #28323d; --boot-bar: #141a21; --boot-fill: rgba(145, 158, 171, 0.16); }
      html[data-boot-nav='mini'] { --boot-nav: 88px; }
    </style>
    <script>
      try {
        var held = JSON.parse(localStorage.getItem('app-settings') || '{}')
        var dark = held.mode === 'dark' || (held.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.dataset.bootMode = 'dark'
        if (held.navLayout === 'mini') document.documentElement.dataset.bootNav = 'mini'
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"><div id="boot" aria-busy="true"><div class="nav"></div><div class="column"><div class="bar"></div><div class="surface"></div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
